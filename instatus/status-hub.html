<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<title>Product Status | TogetherWork</title>
<style>
  :root { --tw-blue:#2b4ff4; --tw-green:#36ba27; --accent:#2b2b2b; --bg:#f4f4f4; --ink:#2b2b2b; --muted:#6b7280; --card:#fff; --border:#e5e7eb;
          --up:#16a34a; --issues:#dc2626; --maint:#d97706; --unknown:#9ca3af; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  .hub-header { background:#fff; border-bottom:1px solid var(--border); padding:16px 24px; }
  .hub-header__inner, .hub-main, .hub-hero__inner { max-width:960px; margin:0 auto; }
  .hub-header__inner { display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .hub-header img { height:34px; width:auto; display:block; }
  .hub-header__tag { font-size:14px; font-weight:600; color:var(--tw-blue); }
  .hub-hero { background:#1e50ff; color:#fff; padding:36px 24px 64px; position:relative; overflow:hidden; font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .hub-hero__bar { width:120px; height:4px; background:var(--tw-green); border-radius:2px; margin:0; }
  .hub-hero__inner { position:relative; z-index:1; }
  .hub-intro { margin:0 0 14px; font-size:clamp(28px,5vw,40px); line-height:1.1; font-weight:800; letter-spacing:-.02em; }
  .hub-sub { margin:0; max-width:520px; font-size:17px; color:rgba(255,255,255,.88); }
  .hub-main { padding:0 24px 64px; margin-top:-34px; position:relative; z-index:2; }
  .hub-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:16px; }
  .hub-stat { display:flex; align-items:center; gap:14px; text-align:left; background:#fff; border:2px solid var(--border); border-radius:12px;
              padding:14px 18px; cursor:pointer; font-family:inherit; color:var(--ink); box-shadow:0 8px 24px rgba(15,27,92,.12); transition:border-color .15s, background .15s; }
  .hub-stat:hover { border-color:#c7d0ff; }
  .hub-stat[aria-pressed="true"] { border-color:var(--tw-blue); background:#f3f6ff; }
  .hub-stat__num { font-size:30px; font-weight:800; line-height:1; min-width:34px; }
  .hub-stat__label { font-size:14px; font-weight:600; color:var(--muted); display:flex; align-items:center; gap:8px; }
  .hub-stat__dot { width:10px; height:10px; border-radius:50%; flex:none; }
  @media (max-width:560px) { .hub-stats { grid-template-columns:1fr; } }
  .hub-search { width:100%; padding:14px 18px; font-size:16px; border:1px solid var(--border); border-radius:12px;
                background:#fff; margin-bottom:20px; font-family:inherit; color:var(--ink); box-shadow:0 8px 24px rgba(15,27,92,.18); }
  .hub-search:focus { outline:2px solid var(--tw-blue); outline-offset:1px; }
  .hub-empty { display:none; text-align:center; color:var(--muted); padding:32px 0; }
  .hub-row[hidden] { display:none; }
  .hub-list { display:flex; flex-direction:column; gap:12px; }
  .hub-row { display:grid; grid-template-columns:200px 1fr auto; align-items:center; gap:24px;
             background:var(--card); border:1px solid var(--border); border-left:5px solid var(--accent,#2b2b2b);
             border-radius:12px; padding:16px 24px; text-decoration:none; color:inherit;
             transition:box-shadow .15s, transform .15s; }
  .hub-row:hover, .hub-row:focus-visible { box-shadow:0 8px 22px rgba(43,79,244,.16); transform:translateY(-1px); }

  .hub-logo { display:flex; align-items:center; gap:12px; min-width:0; width:100%; height:44px; }
  .hub-logo img { max-width:180px; max-height:48px; width:auto; height:40px; object-fit:contain; object-position:left center; display:block; }
  .hub-logo__fallback { width:44px; height:44px; border-radius:10px; background:var(--accent,#2b2b2b); color:#fff;
                        display:flex; align-items:center; justify-content:center; font-weight:700; flex:none; }
  .hub-logo__name { font-weight:700; font-size:16px; overflow:hidden; text-overflow:ellipsis; }

  .hub-status { display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:6px; min-width:0; }
  .hub-detail { display:none; max-width:100%; font-size:13px; font-weight:600; color:var(--tw-blue); cursor:pointer; text-decoration:underline; text-underline-offset:2px;
                white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-left:4px; }
  .hub-detail:hover, .hub-detail:focus-visible { color:#1d36b8; }
  .hub-detail.show { display:block; }
  .hub-embed { display:block; width:230px; height:61px; border:0; pointer-events:none; }
  .hub-pill { display:inline-flex; align-items:center; gap:8px; font-size:14px; font-weight:600; color:#4b5563;
             background:#f3f4f6; border-radius:999px; padding:8px 14px 8px 12px; }
  .hub-dot { width:10px; height:10px; border-radius:50%; background:var(--unknown); flex:none; }
  .hub-row.up       { --st:#16a34a; --st-bg:#dcfce7; --st-ink:#166534; }
  .hub-row.degraded { --st:#eab308; --st-bg:#fef9c3; --st-ink:#854d0e; }
  .hub-row.partial  { --st:#f97316; --st-bg:#ffedd5; --st-ink:#9a3412; }
  .hub-row.major    { --st:#dc2626; --st-bg:#fee2e2; --st-ink:#991b1b; }
  .hub-row.maint    { --st:#2563eb; --st-bg:#dbeafe; --st-ink:#1e40af; }
  .hub-row .hub-dot { background:var(--st, var(--unknown)); }
  .hub-row .hub-pill { background:var(--st-bg, #f3f4f6); color:var(--st-ink, #4b5563); }

  .hub-link { font-size:14px; font-weight:600; color:var(--accent,#2b2b2b); white-space:nowrap; }

  @media (max-width:640px) {
    .hub-row { grid-template-columns:1fr; gap:12px; }
  }

  .hub-modal { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; padding:24px; z-index:50; }
  .hub-modal.open { display:flex; }
  .hub-modal__box { background:#fff; border-radius:12px; width:100%; max-width:1100px; height:90vh; display:flex; flex-direction:column; overflow:hidden; }
  .hub-modal__bar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px; border-bottom:1px solid var(--border); }
  .hub-modal__title { font-weight:700; }
  .hub-modal__actions { display:flex; gap:16px; align-items:center; font-size:14px; }
  .hub-modal__actions a { color:var(--tw-blue); text-decoration:none; }
  .hub-modal__close { border:0; background:none; font-size:26px; line-height:1; cursor:pointer; color:var(--ink); }
  .hub-modal iframe { flex:1; border:0; width:100%; }
  .hub-footer { text-align:center; color:#cbd5ff; background:#0f1b5c; font-size:13px; padding:28px 24px; border-top:4px solid var(--tw-green); }
</style>
</head>

const LOGO_H = {"StudioPro": 32, "Acceptd": 32, "Akada": 33, "Bunk1": 48, "CircuiTree": 32, "ClearViewCRM": 46, "CommunityPass": 31, "Cybergolf": 43, "Doubleknot": 32, "Fonteva": 41, "Gingr": 48, "MassageBook": 31, "OmegaFi": 47, "Onsight Pro": 39, "PetExec": 48, "Protech": 29, "RevPets": 48, "Rock Gym Pro": 47, "ShulCloud": 28, "Smartwaiver": 21, "Springboard": 35};
const ACCENTS = {"StudioPro": "#1e88d8", "Acceptd": "#54cc9c", "Akada": "#54249c", "Bunk1": "#24549c", "CircuiTree": "#24549c", "ClearViewCRM": "#54b454", "CommunityPass": "#54849c", "Cybergolf": "#475569", "Doubleknot": "#0c54b4", "Fonteva": "#0cb4e4", "Gingr": "#e43c3c", "MassageBook": "#fc6c24", "OmegaFi": "#84b4cc", "Onsight Pro": "#3c3c6c", "PetExec": "#243c54", "Protech": "#6cb424", "RevPets": "#3cb49c", "Rock Gym Pro": "#243c84", "ShulCloud": "#243c84", "Smartwaiver": "#6c9c0c", "Springboard": "#54b4e4"};
PRODUCTS.forEach(p => { if (LOGOS[p.name]) { p.logo = LOGOS[p.name]; p.logoH = LOGO_H[p.name]; } });

// Instatus incident impact -> [css class, label, severity rank]
const IMPACT = {
  DEGRADEDPERFORMANCE: ["degraded", "Degraded performance", 1],
  PARTIALOUTAGE:       ["partial",  "Partial outage",       2],
  MAJOROUTAGE:         ["major",    "Major outage",         3]
};
const ALL_CLASSES = ["up", "degraded", "partial", "major", "maint"];

document.getElementById("copyright-year").textContent = new Date().getFullYear();

const modal = document.getElementById("modal"), frame = document.getElementById("modal-frame");
function openModal(p) {
  document.getElementById("modal-title").textContent = p.title || (p.name + " Status");
  document.getElementById("modal-open").href = p.url;
  frame.src = p.url;
  modal.classList.add("open"); modal.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
}
function closeModal() {
  modal.classList.remove("open"); modal.setAttribute("aria-hidden", "true");
  frame.src = "about:blank"; document.body.style.overflow = "";
}
document.getElementById("modal-close").addEventListener("click", closeModal);
modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

const list = document.getElementById("list");
const rows = [...PRODUCTS].sort((a, b) => a.name.localeCompare(b.name)).map(p => {
  const a = document.createElement("a");
  a.className = "hub-row"; a.href = p.url; a.target = "_blank"; a.rel = "noopener";
    a.addEventListener("click", e => { e.preventDefault(); openModal(p); });

  const logo = document.createElement("div"); logo.className = "hub-logo";
  const nameEl = document.createElement("span"); nameEl.className = "hub-logo__name"; nameEl.textContent = p.name;
  if (p.logo) {
    const img = document.createElement("img"); img.src = p.logo; img.alt = p.name;
    if (p.logoH) { img.style.height = p.logoH + "px"; img.style.maxHeight = "none"; }
    img.onerror = () => { img.replaceWith(initials(p)); logo.appendChild(nameEl); };
    logo.appendChild(img);
  } else { logo.appendChild(initials(p)); logo.appendChild(nameEl); }

  const status = document.createElement("div"); status.className = "hub-status";
  if (p.embed) {
    const f = document.createElement("iframe");
    f.src = p.embed; f.title = p.name + " status"; f.loading = "lazy"; f.scrolling = "no"; f.className = "hub-embed";
    status.appendChild(f);
  } else {
    status.innerHTML = '<span class="hub-pill"><span class="hub-dot"></span><span class="hub-label">Checking…</span></span><span class="hub-detail"></span>';
  }

  const dl = status.querySelector(".hub-detail");
  if (dl) {
    const go = e => { e.preventDefault(); e.stopPropagation(); openModal({ title: dl.dataset.title || p.name, url: dl.dataset.url || p.url }); };
    dl.addEventListener("click", go);
    dl.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") go(e); });
    dl.setAttribute("role", "link"); dl.tabIndex = 0;
  }

  const link = document.createElement("span"); link.className = "hub-link"; link.innerHTML = "View full status page &rarr;";

  a.append(logo, status, link);
  list.appendChild(a);
  return { p, a };
});

let activeFilter = null;
function applyFilters() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  let shown = 0;
  rows.forEach(({ p, a }) => {
    const textOk = !q || (p.name + " " + (p.keywords || "")).toLowerCase().includes(q);
    const stateOk = !activeFilter || a.dataset.state === activeFilter;
    const match = textOk && stateOk;
    a.hidden = !match; if (match) shown++;
  });
  document.getElementById("empty").style.display = shown ? "none" : "block";
}
function updateStats() {
  const n = { up: 0, incident: 0, maint: 0 };
  rows.forEach(({ a }) => { if (n[a.dataset.state] !== undefined) n[a.dataset.state]++; });
  Object.keys(n).forEach(k => document.getElementById("n-" + k).textContent = n[k]);
  applyFilters();
}
document.getElementById("search").addEventListener("input", applyFilters);
document.querySelectorAll(".hub-stat").forEach(btn => btn.addEventListener("click", () => {
  const f = btn.dataset.filter;
  activeFilter = activeFilter === f ? null : f;
  document.querySelectorAll(".hub-stat").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.filter === activeFilter)));
  applyFilters();
}));

function initials(p) {
  const d = document.createElement("span"); d.className = "hub-logo__fallback";
  d.textContent = p.name.split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();
  return d;
}

async function load() {
  await Promise.all(rows.filter(r => !r.p.embed).map(async ({ p, a }) => {
    const label = a.querySelector(".hub-label");
    const detail = a.querySelector(".hub-detail");
    try {
      const res = await fetch(p.url + "/summary.json?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      const s = data.page.status;
      const incidents = (data.activeIncidents || []).filter(i => i.status !== "RESOLVED");
      const maint = (data.activeMaintenances || []).find(m => m.status === "INPROGRESS");
      let cls = "up", text = "All systems operational", name = "", extra = 0, url = "", kind = "";
      if (incidents.length) {
        // worst active incident wins
        const worst = incidents.reduce((w, i) =>
          ((IMPACT[i.impact] || [,,0])[2] > ((IMPACT[w.impact] || [,,0])[2]) ? i : w), incidents[0]);
        const m = IMPACT[worst.impact] || IMPACT.PARTIALOUTAGE; // unknown impact: treat as partial
        cls = m[0]; text = m[1]; name = worst.name; url = worst.url; kind = "incident"; extra = incidents.length - 1;
      } else if (maint) {
        cls = "maint"; text = "Under maintenance"; name = maint.name; url = maint.url; kind = "maintenance";
        extra = (data.activeMaintenances || []).filter(x => x.status === "INPROGRESS").length - 1;
      } else if (s === "HASISSUES") {
        cls = "partial"; text = "Experiencing issues"; // no incident detail available
      }
      ALL_CLASSES.forEach(c => a.classList.remove(c)); a.classList.add(cls);
      a.dataset.state = cls === "up" ? "up" : cls === "maint" ? "maint" : "incident";
      label.textContent = text;
      const linkText = kind ? "View " + kind + " \u2192" + (extra > 0 ? "  (+" + extra + " more)" : "") : "";
      detail.textContent = linkText; detail.title = name;
      detail.dataset.title = name; detail.dataset.url = url || p.url;
      detail.classList.toggle("show", !!linkText);
    } catch (e) { a.dataset.state = "unknown"; label.textContent = "Status unavailable"; if (detail) detail.classList.remove("show"); }
  }));
  updateStats();
}
load(); setInterval(load, 60000);
</script>
